<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Herbert Valadares — Full Stack Developer">
  <defs>
    <linearGradient id="acc" x1="0" x2="1">
      <stop offset="0" stop-color="#7cffc4"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#8b7bff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: 'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      .p { animation: tw 3.2s ease-in-out infinite; }
      @keyframes tw { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
      .role { opacity: 0; animation: cycle 12s infinite; }
      .r2 { animation-delay: 3s } .r3 { animation-delay: 6s } .r4 { animation-delay: 9s }
      @keyframes cycle { 0% { opacity: 0; transform: translateY(8px) } 3%, 22% { opacity: 1; transform: none } 25%, 100% { opacity: 0 } }
      .caret { animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .float { animation: fl 6s ease-in-out infinite; transform-origin: 950px 160px; }
      @keyframes fl { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="22" fill="#06070b"/>
  <rect width="1200" height="320" rx="22" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow)"/>

